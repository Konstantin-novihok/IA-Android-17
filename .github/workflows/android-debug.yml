name: Android Debug APK

on:
  push:
    branches: [ main, "feature/**" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Fetch llama.cpp sources
        run: bash scripts/fetch-llama.sh

      - name: Install Android SDK components (NDK, CMake)
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-35" "build-tools;34.0.0" "ndk;27.2.12479018" "cmake;3.22.1"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle --no-daemon --console=plain --stacktrace :app:assembleDebug

      - name: List native libraries inside APK
        run: unzip -l app/build/outputs/apk/debug/*.apk | grep -E "lib/arm64-v8a/.*\.so" || true

      - uses: actions/upload-artifact@v4
        with:
          name: IA-Android-17-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
